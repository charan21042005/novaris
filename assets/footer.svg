<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="100%" height="100%">
  <defs>
    <!-- Matching Background Gradient -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="50%" stop-color="#0E172A" />
      <stop offset="100%" stop-color="#0A0F1F" />
    </linearGradient>

    <!-- Matching Accent Gradient -->
    <linearGradient id="footerAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Top Wave Overlay -->
    <linearGradient id="footerWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.20" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.15" />
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="footerGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" opacity="0.5" />
    </pattern>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="130" rx="16" fill="url(#footerBg)" />

  <!-- Background Tech Grid -->
  <rect width="1200" height="130" rx="16" fill="url(#footerGrid)" />

  <!-- Top Inverted Wave 1 -->
  <path d="M 0 0 L 1200 0 L 1200 35 Q 900 10 600 40 T 0 25 Z" fill="url(#footerWave)" />

  <!-- Thin Highlight Line on Top Wave -->
  <path d="M 0 25 Q 600 40 900 10 T 1200 35" fill="none" stroke="url(#footerAccent)" stroke-width="1.8" opacity="0.7" />

  <!-- Bottom Border Accent Strip -->
  <rect x="0" y="126" width="1200" height="4" fill="url(#footerAccent)" />

  <!-- Author & Architectural Statement -->
  <text x="600" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC" letter-spacing="2">
    NOVARIS • DISTRIBUTED PAYMENT SETTLEMENT &amp; FRAUD INTELLIGENCE
  </text>

  <text x="600" y="98" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#94A3B8" letter-spacing="1">
    Engineered by Tokachichu Sri Charan  ·  Go  ·  Kafka  ·  PostgreSQL  ·  Redis  ·  ONNX  ·  React 19  ·  Kubernetes
  </text>
</svg>
