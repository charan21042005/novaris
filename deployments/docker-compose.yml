# ==============================================================================
# NOVARIS: Distributed Payment Settlement & Adaptive Fraud Intelligence Platform
# Local Development Infrastructure Mesh
# ==============================================================================
# Services:
#   1. PostgreSQL 16: Primary ACID relational storage for accounts, double-entry
#      journal entries, transactions, and the transactional outbox table.
#   2. Redis 7: High-speed in-memory store for distributed idempotency locks (SETNX),
#      sliding-window rate limiting, and Redlock mutex coordination.
#   3. Apache Kafka (KRaft mode): Event streaming backbone partitioned by account_id
#      for ordered transaction processing without external ZooKeeper dependencies.
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 (Ledger & Outbox Persistence)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: novaris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: novaris_db
      POSTGRES_USER: novaris_admin
      POSTGRES_PASSWORD: dev_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Automatically executes migrations on initial container initialization
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novaris_admin -d novaris_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Redis 7 (In-Memory Concurrency & Rate Limiting)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: novaris-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. Apache Kafka (KRaft Single-Node Mode)
  # ----------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: novaris-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@novaris-kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://novaris-kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      # Fixed cluster ID for local deterministic initialization
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafkadata:/var/lib/kafka/data

# ------------------------------------------------------------------------------
# Persistent Volume Declarations
# ------------------------------------------------------------------------------
volumes:
  pgdata:
    name: novaris_pgdata
  redisdata:
    name: novaris_redisdata
  kafkadata:
    name: novaris_kafkadata
